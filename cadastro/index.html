<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">

<!-- =========================================================================
     PARA MUDAR O DESTINO DESTE QR, TROQUE APENAS A URL DA LINHA ABAIXO.
     Mantenha o "0;url=" na frente. Depois: git commit + git push origin main.
     O GitHub Pages publica em cerca de 1 minuto.

     Esta é a ÚNICA linha a editar — o link de emergência mais abaixo lê
     o destino daqui sozinho, então não há risco de os dois divergirem.
     ========================================================================= -->
<meta http-equiv="refresh" content="0;url=https://app.prontto.ai/f/feirao-astorga-agosto-2026">

<title>Zamper's — cadastro</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#0A1F4D;color:#F4F1E8;text-align:center;padding:24px;
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
  p{font-size:17px;font-weight:600;line-height:1.5;margin:0 0 18px}
  a{color:#FFC72C;font-weight:800}
</style>
</head>
<body>
  <div>
    <p>Abrindo seu cadastro…</p>
    <p><a id="ir" href="#">Toque aqui se não abrir sozinho</a></p>
  </div>
<script>
  // Lê o destino do próprio <meta> acima: uma fonte só, sem duplicar a URL.
  var c = document.querySelector('meta[http-equiv="refresh"]').content;
  var destino = c.slice(c.indexOf('url=') + 4);
  document.getElementById('ir').href = destino;
  location.replace(destino);   // mais rápido que o meta refresh e não polui o histórico
</script>
</body>
</html>
